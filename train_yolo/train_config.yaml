# ==============================
# 训练总配置（可直接运行）
# 分类清晰 + 注释 + 推荐范围/默认建议
# ==============================

# ——— 1) 模型配置 ——#
model:
  path: "yolo11m-pose.pt"     # 预训练权重文件；可用 yolo11n/m/l/x-pose.pt 或自训权重
  imgsz: 640                  # 输入尺寸；[256, 1536]；常用 512/640/768（大更准、慢+显存大）
  device: "0"                 # 设备：GPU索引如 "0"、多卡 "0,1"，或 "cpu"

# ——— 2) 数据集配置 ——#
dataset:
  source_dir: "C:/data/pose_labels"          # 原始数据目录（标注在此）
  output_dir: "C:/data/pose_labels/processed"  # 预处理输出目录（会生成 dataset.yaml）
  random_seed: 42                             # 随机种子；复现实验（建议固定）
  train_ratio: 0.7                            # 训练集占比；(0,1)
  val_ratio: 0.2                              # 验证集占比；(0,1)；两者之和 < 1
  test_ratio: 0.1                             # 测试集占比；可为 0；三者之和=1

# ——— 3) 训练核心超参 ——#
training:
  # —— 训练循环 ——
  epochs: 150               # 总轮次；>=1；常用 50~300；小数据/强增强可更大
  batch: 24                 # 批大小；>=1；受显存限制；常用 8~64；mosaic>0 建议 >=4
  workers: 8                # DataLoader 进程数；[0, CPU核数]；Linux>Windows；0最稳
  seed: 42                  # 训练种子；保持复现；设为 null 则每次不同
  accumulate: 1             # 梯度累积步数；>=1；等效增大 batch；显存不足时用 2/4
  amp: true                 # 自动混合精度（FP16/BF16）；GPU 推荐开启以提速省显存
  deterministic: false      # 设为 true 可提升复现性（会略降速）

  # —— 优化器 & 学习率 ——
  optimizer: "AdamW"        # auto/SGD/Adam/AdamW；SGD稳、AdamW对噪声更鲁棒
  lr0: 0.0015               # 初始LR；(0,0.1]；SGD≈1e-2；Adam/AdamW≈1e-3~3e-3
  lrf: 0.01                 # 最终LR比例（余弦/线性）(0,1]；常用 0.01~0.2
  momentum: 0.937           # 动量/一阶β；[0.6, 0.999]；SGD/Adam(W) 通用建议
  weight_decay: 0.0005      # 权重衰减；[0, 0.01]；AdamW 解耦衰减更稳
  # —— 热身（前期稳定） ——
  warmup_epochs: 3.0        # 热身轮次；[0, 10]；大batch可减小
  warmup_momentum: 0.8      # 热身动量；[0.5, 0.95]
  warmup_bias_lr: 0.1       # 热身阶段 bias 的较大LR；[0.05, 0.5]

  # —— 正则化 & 提前停止 ——
  dropout: 0.0              # Dropout 概率；[0, 0.5]；一般检测/姿态保持 0
  label_smoothing: 0.0      # 标签平滑；[0, 0.2]；噪声标签时可设 0.05~0.1
  patience: 50              # EarlyStopping 容忍轮数；[10, 200]；-1 关闭
  ema: true                 # 指数滑动平均；收敛更稳，推理默认用 EMA 权重

  # —— 验证/日志/断点 ——
  val: true                 # 训练中做验证；建议开启
  project: "runs/train"     # 日志根目录
  name: "exp-rot-mosaic"    # 实验名；自动去重
  save: true                # 保存权重与日志
  save_period: -1           # >0 每 N 轮保存一次；-1 仅保存 best/last
  exist_ok: false           # 若目录已存在是否直接覆盖
  plots: true               # 保存可视化图（曲线、样例）
  resume: false             # 从上次断点继续（需要 last.pt）
  freeze: 0                 # 冻结前 N 层；微调时可用，如 10/50
  close_logger: false       # 关闭内部 logger；一般保持 false

  # —— 数据加载策略 ——
  cache: false              # 训练前缓存数据到内存/磁盘；true/"ram"/"disk"
  rect: false               # 矩形采样；长宽比多样时可提速但略降增强随机性
  shuffle: true             # 每 epoch 打乱样本

  # —— 任务相关（可选） ——
  single_cls: false         # 将多类当单类；小样本/类别不均衡时偶尔尝试
  classes: null             # 仅训练指定类索引列表；null 表示全部
  max_det: 300              # 单图最大检测数；姿态通常无须太大

  # —— 损失相关（目标/框/分布） ——
  loss:
    cls: 0.5                # 分类损失权重；[0, 2]；多类多时可小调
    box: 7.5                # 框损失权重；[1, 15]
    dfl: 1.5                # 分布焦点损失权重；[0.5, 3]

# ——— 4) 数据增强（旋转 + 拼接 等）——#
augmentation:
  enable: true              # 总开关；false 完全禁用增强
  preset: null              # 预设名（见下方 presets）；命令行可 --preset 覆盖

  # —— 几何 ——
  degrees: 10.0             # 旋转角度（度）；[0, 45]；只开旋转就改这里
  translate: 0.10           # 平移比例；[0, 0.3]
  scale: 0.50               # 缩放幅度；[0, 0.9]；0.5 表示放缩上下各 50%
  shear: 1.0                # 切变（度）；[0, 10]
  perspective: 0.0          # 透视畸变；[0, 0.001]；大多数场景 0
  fliplr: 0.20              # 左右翻转概率；[0, 1]
  flipud: 0.0               # 上下翻转概率；[0, 1]

  # —— 拼接/混合 ——
  mosaic: 0.0               # 四图拼接概率；[0, 1]；batch>=4 更稳
  close_mosaic: 10          # 第 N 轮后关闭 mosaic；[0, epochs]；0=不关闭
  mixup: 0.0                # mixup 概率；[0, 1]；小样本可 0.1 试探
  copy_paste: 0.0           # 分割/实例更常用；姿态/检测通常 0

  # —— 颜色 ——
  hsv_h: 0.015              # 色调扰动；[0, 0.05]
  hsv_s: 0.70               # 饱和度；[0, 0.9]
  hsv_v: 0.40               # 亮度；[0, 0.9]

# ——— 5) 预设（可一键切换增强风格）——#
presets:
  light_rotate_mosaic:
    degrees: 5.0
    mosaic: 0.5
    close_mosaic: 10
    fliplr: 0.1
  strong_mosaic:
    degrees: 10.0
    mosaic: 1.0
    close_mosaic: 20
    fliplr: 0.2
  val_friendly:
    degrees: 0.0
    mosaic: 0.0
    close_mosaic: 0
    fliplr: 0.0
