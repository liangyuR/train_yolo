# 小地图检测模型训练配置

# 模型配置
model:
  path: "yolo11m-pose.pt"
  imgsz: 640
  device: "0"

# 数据集配置
dataset:
  # "detect" or "obb" or "pose"
  task_type: "pose"  
  kpt_shape: [3, 3]
  source_dir: "C:/data/pose_labels"
  output_dir: "C:/data/pose_labels/processed/"

  train_ratio: 0.7
  val_ratio: 0.2
  test_ratio: 0.1
  random_seed: 42

  validate_labels: true

  image_extensions:
    - ".png"
    - ".jpg"
    - ".jpeg"

  dataset_structure:
    images_dir: "images"
    labels_dir: "labels"
    train: "train"
    val: "val"
    test: "test"

  rename_files: true
  rename_pattern: "minimap_{index:05d}"

  num_workers: 4

  export_summary: true
  summary_path: "dataset_summary.json"

  generate_data_yaml: true
  data_yaml_name: "dataset.yaml"


# 输出配置
output:
  # 项目名称（使用统一路径，相对于 data/models/training/minimap）
  project: "C:/data/pose_labels/model"
  # 实验名称
  name: "exp_minimap"
  # 是否保存训练过程
  save: true
  # 保存周期（每 N 个 epoch 保存一次）
  save_period: 10
  # 是否进行验证
  val: true
  # 验证阶段置信度阈值（输出更多检测结果）
  val_conf_threshold: 0.001

training:
  workers: 8
  epochs: 150          # 或 200，多给点时间让它慢慢学
  batch: 24             # 看显存，能 16 更好
  optimizer: "AdamW"
  lr0: 0.0015
  lrf: 0.01

  mosaic: 0.1          # 大幅降低，甚至可以直接 0.0
  copy_paste: 0.0      # 你本身就只有一个 minimap，不需要复制粘贴
  mixup: 0.0

  close_mosaic: 50     # 如果 mosaic>0，就在后 1/3 epoch 彻底关掉

augmentation:
  hsv_h: 0
  hsv_s: 0
  hsv_v: 0

  degrees: 0.0         # 小地图不会旋转，干脆关掉
  scale: 0.2           # 缩放幅度减小
  translate: 0.05      # 平移减小
  fliplr: 0.0          # 先关掉水平翻转，等效果好再考虑打开一点

  brightness: 0.1
  contrast: 0.1
  blur: 0.05

# 模型名称，图像路径（文件夹下的所有图片），输出路径示例
test:
  model: "data/models/training/minimap/exp_minimap4/weights/best.pt"
  image_dir: "data/minimap_images/"
  output_dir: "data/models/training/minimap/exp_minimap4/val_result"
  conf_threshold: 0.75   # 置信度阈值（放宽以观察更多检测结果）
  iou_threshold: 0.5     # IoU 阈值（用于 NMS）
  show_result: false     # 是否显示结果窗口（批量处理时建议设为 false）